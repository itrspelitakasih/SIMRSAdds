# Nginx server block untuk E-Tiket RS (Laravel 12).
#
# Cara pasang di VPS:
#   1. Sesuaikan `server_name` dan path `root` di bawah.
#   2. sudo cp deploy/nginx/etiket.conf /etc/nginx/sites-available/etiket.conf
#   3. sudo ln -s /etc/nginx/sites-available/etiket.conf /etc/nginx/sites-enabled/etiket.conf
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Aktifkan HTTPS dengan Certbot:
#        sudo certbot --nginx -d your-domain.com
#      (Certbot akan otomatis menambahkan blok server 443 + redirect HTTP->HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    root /var/www/etiket/public;
    index index.php;

    charset utf-8;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Blokir akses ke file dotfiles (.env, .git, dll) dan storage internal.
    location ~ /\. {
        deny all;
    }

    location ~ ^/(storage/app/private|bootstrap/cache|\.env) {
        deny all;
    }

    access_log /var/log/nginx/etiket-access.log;
    error_log  /var/log/nginx/etiket-error.log;
}
