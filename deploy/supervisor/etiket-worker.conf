; Supervisor config untuk queue worker E-Tiket IT Rumah Sakit.
; Menjaga `php artisan queue:work` tetap hidup 24/7 di server produksi,
; supaya notifikasi WhatsApp (tiket baru & tiket selesai) selalu terkirim.
;
; Cara pasang di VPS (Ubuntu/Debian):
;   1. sudo apt install supervisor            # jika belum ada
;   2. Sesuaikan `directory`, `command` (path php & artisan), dan `user` di bawah
;   3. sudo cp deploy/supervisor/etiket-worker.conf /etc/supervisor/conf.d/etiket-worker.conf
;   4. sudo supervisorctl reread
;   5. sudo supervisorctl update
;   6. sudo supervisorctl start etiket-worker:*
;
; Cek status  : sudo supervisorctl status etiket-worker:*
; Lihat log   : tail -f storage/logs/worker.log

[program:etiket-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/etiket
command=php /var/www/etiket/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/etiket/storage/logs/worker.log
stopwaitsecs=3600
